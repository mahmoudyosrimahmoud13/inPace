name: inpace_mobile
description: inPace for Android. Runs the same inPace app (Python) on the phone and shows it in a full-screen web view.
publish_to: none
version: 1.12.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  serious_python: ^6.0.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.4
  app_links: ^6.3.0
  http: ^1.2.2

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
