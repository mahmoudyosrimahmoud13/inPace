name: inpace_mobile
description: inPace for Android. Runs the same inPace app (Python) on the phone and shows it in a full-screen web view.
publish_to: none
version: 1.21.0+12100

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  serious_python: ^6.0.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0
  webview_flutter_platform_interface: ^2.10.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.4
  app_links: ^6.3.0
  http: ^1.2.2
  file_picker: ^10.3.3   # 10.3.3+ builds with Flutter's Android SDK (8.x was stuck on Android 14)
  permission_handler: ^11.3.1
  share_plus: ^10.1.2
  flutter_file_dialog: ^3.0.2
  flutter_local_notifications: ^21.0.0   # 21.x builds with Android SDK 36 (22+ wants newer build tools)
  timezone: ^0.11.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.0

# The app icon (made by: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "../packaging/icon.png"
  adaptive_icon_background: "#FFD43B"
  adaptive_icon_foreground: "../packaging/android-icon/foreground.png"
  adaptive_icon_monochrome: "../packaging/android-icon/foreground.png"

# The splash screen Android shows while the app starts (made by: dart run flutter_native_splash:create).
# Tempo and the inPace logo on yellow. Android 12 and newer show Tempo in a circle with the logo below.
flutter_native_splash:
  color: "#FFD43B"
  image: assets/splash/splash.png
  android_12:
    color: "#FFD43B"
    image: assets/splash/splash_android12.png
    branding: assets/splash/branding.png
  ios: false
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/splash/
