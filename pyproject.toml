[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inpace"
version = "1.13.0"
description = "Learn at your pace. Prove you kept it. A local, open-source learning accountability app."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "starlette>=0.37",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "markdown-it-py>=3.0",
  "pynacl>=1.5",
  "python-multipart>=0.0.9",
  "pygments>=2.17",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
inpace = "inpace.__main__:main"

[tool.setuptools.packages.find]
include = ["inpace*"]

[tool.setuptools.package-data]
inpace = ["templates/*.html", "static/*", "static/fonts/*", "static/pdfjs/*", "sample_courses/**/*", "locales/*.json"]
