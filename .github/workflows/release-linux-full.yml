name: release (Linux with its own engine)

# The Linux download "with its own engine" (Qt WebEngine inside), built on its own so it never holds up
# the main release. Push a version tag and this runs next to release.yml:
#   1. builds inPace-linux-full.deb, inPace-linux-full.AppImage and inPace-linux-full.tar.gz
#   2. checks the app starts and opens in its own Qt window
#   3. waits for release.yml to publish the release page, then adds these files to it
#      and adds their lines to SHA256SUMS (the app's auto-update checks every download against it)
# "Run workflow" builds it again for an existing version (type the tag, for example v1.29.2).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to build and add to (for example v1.29.2). Leave empty to only build."
        required: false

permissions:
  contents: write

concurrency:
  group: linux-full-${{ github.ref_name }}-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Linux (with its own engine)
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Use the tag as the version number
        if: env.TAG != ''
        run: |
          python3 - "${TAG#v}" <<'PY'
          import pathlib, re, sys
          v = sys.argv[1]
          for f, pat, rep in (("inpace/__init__.py", r'__version__ = "[^"]*"', f'__version__ = "{v}"'),
                              ("pyproject.toml", r'(?m)^version = "[^"]*"', f'version = "{v}"')):
              p = pathlib.Path(f)
              p.write_text(re.sub(pat, rep, p.read_text(encoding="utf-8"), count=1), encoding="utf-8")
          print("Building inPace", v)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install . pyinstaller pillow PySide6-Essentials==6.8.1 PySide6-Addons==6.8.1
      - name: Build the app
        run: python packaging/build.py --full
      - name: Get the system libraries the engine uses (most Linux desktops already have them)
        run: |
          sudo apt-get update -q > /dev/null
          sudo apt-get install -y -q libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libnss3 libnspr4 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libxkbfile1 libxshmfence1 libgbm1 libegl1 libgl1 libasound2 libfontconfig1 libdbus-1-3 > /dev/null
      - name: Check the app starts
        run: |
          APP=dist/inPace/inPace
          INPACE_HOME="$RUNNER_TEMP/vault" "$APP" --no-browser --port 8799 &
          for i in $(seq 1 90); do curl -s -o /dev/null http://127.0.0.1:8799/setup && break; sleep 1; done
          curl -sf -o "$RUNNER_TEMP/setup.html" http://127.0.0.1:8799/setup
          grep -q "Welcome to inPace" "$RUNNER_TEMP/setup.html"
          curl -sf -X POST http://127.0.0.1:8799/quit > /dev/null || true
      - name: Check the app opens in its own window (Qt)
        run: |
          dist/inPace/inPace --which-window "$RUNNER_TEMP/window.txt"
          GOT=$(cat "$RUNNER_TEMP/window.txt")
          echo "Window type: $GOT"
          if [ "$GOT" != "qt" ]; then
            # Show what the bundled engine is missing, so the next fix is clear.
            I=dist/inPace/_internal
            LD_LIBRARY_PATH="$I:$I/PySide6/Qt/lib" ldd "$I/PySide6/Qt/lib/libQt6WebEngineCore.so.6" "$I"/PySide6/QtWebEngine*.so | grep "not found" | sort -u || true
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: app-Linux-full
          path: |
            dist/inPace-linux-full.tar.gz
            dist/inPace-linux-full.deb
            dist/inPace-linux-full.AppImage

      - name: Wait for the release page, then add these downloads to it
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release.yml publishes the page when the Windows, Mac and Linux builds are done (often 20 to 40 minutes).
          for i in $(seq 1 120); do
            if gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx SHA256SUMS; then break; fi
            echo "Waiting for the $TAG release page… ($i)"; sleep 30
          done
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx SHA256SUMS || { echo "The release page never appeared."; exit 1; }
          cd dist
          # Checksums first, files second: a copy that updates in between then just waits for its file.
          gh release download "$TAG" -p SHA256SUMS -O SHA256SUMS --clobber
          grep -v "inPace-linux-full" SHA256SUMS > sums.new || true
          sha256sum inPace-linux-full.deb inPace-linux-full.AppImage inPace-linux-full.tar.gz >> sums.new
          mv sums.new SHA256SUMS && cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber
          gh release upload "$TAG" inPace-linux-full.deb inPace-linux-full.AppImage inPace-linux-full.tar.gz --clobber
