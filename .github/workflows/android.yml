name: android

# Builds the Android app (APK). Runs by hand from the Actions tab, and on version tags.
# Kept separate from the desktop release while the Android version is new.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90  # a stuck download never holds a release for hours
    defaults:
      run:
        working-directory: mobile
    env:
      SERIOUS_PYTHON_VERSION: "3.12"
      SERIOUS_PYTHON_SITE_PACKAGES: ${{ github.workspace }}/mobile/build/site-packages
      SERIOUS_PYTHON_APP: ${{ github.workspace }}/mobile/build/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Start with a clean Gradle download cache
        run: rm -rf ~/.gradle/caches/*/download* ~/.gradle/caches/download* || true
      # The same Python as the phone (3.12), so code compiled during the build runs there.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/inpace-release.jks"
            echo "INPACE_KEYSTORE=$RUNNER_TEMP/inpace-release.jks" >> "$GITHUB_ENV"
            echo "Signing with the inPace release key."
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "::error::Releases must be signed with the inPace release key. Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets."
            exit 1
          else
            echo "No release key: this test build is signed with a temporary key."
          fi
      - name: Build the APKs
        env:
          INPACE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          flutter --version
          java -version 2>&1 | head -1
          # A first failure is often a passing network or download problem: clean up and try once more.
          if ! bash build_android.sh; then
            echo "::warning::The first try failed. Cleaning up and trying once more."
            rm -rf ~/.gradle/caches/*/download* ~/.gradle/caches/download* build/app/intermediates || true
            flutter clean || true
            bash build_android.sh
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: inPace-android
          path: mobile/out/*.apk
      - name: Add the APKs to the release
        # The release page is made by the release workflow, with the notes, the computer downloads and SHA256SUMS.
        # Wait for it, then only add the APK: this job never creates a half-empty release (computers checking for
        # updates would find a newer version with no file for them) and never changes the notes.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 90); do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx SHA256SUMS; then
              gh release upload "$GITHUB_REF_NAME" out/*.apk --repo "$GITHUB_REPOSITORY" --clobber
              echo "Added the APK to release $GITHUB_REF_NAME."
              exit 0
            fi
            echo "Waiting for the release page of $GITHUB_REF_NAME ($i/90)..."
            sleep 30
          done
          echo "::error::The release page for $GITHUB_REF_NAME didn't appear (did the release workflow fail?). The APK is in this run's Artifacts; run this workflow again once the release is published."
          exit 1
