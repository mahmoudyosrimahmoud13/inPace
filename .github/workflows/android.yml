name: android

# Builds the Android app (APK). Runs by hand from the Actions tab, and on version tags.
# Kept separate from the desktop release while the Android version is new.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      SERIOUS_PYTHON_VERSION: "3.12"
      SERIOUS_PYTHON_SITE_PACKAGES: ${{ github.workspace }}/mobile/build/site-packages
      SERIOUS_PYTHON_APP: ${{ github.workspace }}/mobile/build/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build the APKs
        run: bash build_android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: inPace-android
          path: mobile/out/*.apk
      - name: Add the APKs to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/out/*.apk
