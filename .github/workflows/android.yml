name: android

# Builds the Android app (APK). Runs by hand from the Actions tab, and on version tags.
# Kept separate from the desktop release while the Android version is new.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      SERIOUS_PYTHON_VERSION: "3.12"
      SERIOUS_PYTHON_SITE_PACKAGES: ${{ github.workspace }}/mobile/build/site-packages
      SERIOUS_PYTHON_APP: ${{ github.workspace }}/mobile/build/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Make the Android project
        run: |
          flutter create --org org.inpace --project-name inpace_mobile --platforms=android .
          python3 tools/prepare_android.py
      - name: Put inPace (the Python app) inside
        run: |
          rm -rf app/src/inpace
          cp -r ../inpace app/src/inpace
          find app/src -name "__pycache__" -type d -prune -exec rm -rf {} +
      - name: Get Flutter packages
        run: flutter pub get
      - name: Package Python and its libraries for Android
        run: dart run serious_python:main package app/src -p Android -r -r -r app/src/requirements.txt
      - name: Build the APK
        run: flutter build apk --release --split-per-abi
      - name: Name the files
        run: |
          mkdir -p out
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$f" | sed -e 's/app-//' -e 's/-release.apk//')
            cp "$f" "out/inPace-android-$abi.apk"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: inPace-android
          path: mobile/out/*.apk
