name: android

# Builds the Android app (APK). Runs by hand from the Actions tab, and on version tags.
# Kept separate from the desktop release while the Android version is new.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      SERIOUS_PYTHON_VERSION: "3.12"
      SERIOUS_PYTHON_SITE_PACKAGES: ${{ github.workspace }}/mobile/build/site-packages
      SERIOUS_PYTHON_APP: ${{ github.workspace }}/mobile/build/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Start with a clean Gradle download cache
        run: rm -rf ~/.gradle/caches/*/download* ~/.gradle/caches/download* || true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/inpace-release.jks"
            echo "INPACE_KEYSTORE=$RUNNER_TEMP/inpace-release.jks" >> "$GITHUB_ENV"
            echo "Signing with the inPace release key."
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "::error::Releases must be signed with the inPace release key. Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets."
            exit 1
          else
            echo "No release key: this test build is signed with a temporary key."
          fi
      - name: Build the APKs
        env:
          INPACE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: bash build_android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: inPace-android
          path: mobile/out/*.apk
      - name: Add the APKs to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/out/*.apk
