name: website

# Publishes the inPace website (the site/ folder) to GitHub Pages:
#   https://mahmoudyosrimahmoud13.github.io/inPace/
# Runs whenever something in site/ changes on main, or with the "Run workflow" button.
on:
  push:
    branches: [main, master]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # A new name for each attempt, so "Re-run jobs" doesn't trip over the copy from the last attempt.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
