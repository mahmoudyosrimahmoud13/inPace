name: release

# Push a version tag and GitHub does the rest:
#   git tag v1.0.0 && git push --tags
# It tests, builds the Windows, Mac and Linux apps, checks each one starts,
# then publishes one release page with all three downloads and the notes from CHANGELOG.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # "Run workflow" button: builds the apps without publishing a release

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            file: dist/inPace-windows.zip
            extra: pywebview
          - os: macos-latest
            label: Mac
            file: dist/inPace-mac.dmg
            extra: pywebview
          - os: ubuntu-22.04
            label: Linux
            file: |
              dist/inPace-linux.tar.gz
              dist/inPace-linux.deb
            extra: pillow
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install . pyinstaller ${{ matrix.extra }} pytest httpx
      - name: Test
        run: python -m pytest -q
      - name: Build the app
        run: python packaging/build.py
      - name: Check the app starts
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then APP=dist/inPace.exe;
          elif [ "$RUNNER_OS" = "macOS" ]; then APP=dist/inPace.app/Contents/MacOS/inPace;
          else APP=dist/inPace; fi
          INPACE_HOME="$RUNNER_TEMP/vault" "$APP" --no-browser --port 8799 &
          for i in $(seq 1 90); do curl -s -o /dev/null http://127.0.0.1:8799/setup && break; sleep 1; done
          curl -sf http://127.0.0.1:8799/setup | grep -q "Welcome to inPace"
          curl -sf -X POST http://127.0.0.1:8799/quit > /dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.label }}
          path: ${{ matrix.file }}

  publish:
    name: Publish the release page
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - name: Write the release notes
        run: python packaging/release_notes.py "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: inPace ${{ github.ref_name }}
          body_path: notes.md
          files: |
            downloads/inPace-windows.zip
            downloads/inPace-mac.dmg
            downloads/inPace-linux.tar.gz
            downloads/inPace-linux.deb
